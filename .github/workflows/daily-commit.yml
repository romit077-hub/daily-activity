name: Daily Auto Commit

on:
  schedule:
    # Runs at 00:00 UTC every day (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables a manual "Run workflow" button for testing

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update timestamp file
        run: |
          echo "Last run: $(date -u)" > last_updated.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "YOUR_GITHUB_USERNAME"
          git config --global user.email "YOUR_GITHUB_VERIFIED_EMAIL@example.com"
          git add last_updated.txt
          git commit -m "chore: automated daily activity $(date -u +'%Y-%m-%d')" || exit 0
          git push
